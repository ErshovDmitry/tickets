# CI: lint + cross-platform build (linux / windows / macos).
# Version stamp comes from git describe; v* tag pushes act as release candidates.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod owns the Go version; a floating 'stable' literal would drift.
          go-version-file: go.mod

      # gofmt -l exits 0 even when files need formatting, hence the test wrapper.
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Linter versions are pinned: a new release may add findings and turn CI
      # red without any change in this repository, so the toolchain must stay
      # reproducible.
      - name: Install linters (pinned)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # staticcheck runs without exclusions: the only two known findings
      # (SA4006 in internal/cli/integration_flag_test.go, SA6006 in
      # internal/cli/usage.go) are owned by ticket T-0102, so suppressing them
      # here would hide regressions in every other file.
      - name: Staticcheck
        run: staticcheck ./...

      # gosec -exclude-rules format is path-regex:rules; the path key is a
      # regex anchored with '$', so only that exact file is excluded and a
      # similarly named sibling file is still checked. Every exclusion was
      # triaged as a false positive / accepted risk; see the wiki review page
      # ff563497-52dc-4ed8-8a2e-8bd360051390.
      - name: Gosec
        run: |
          gosec -exclude-rules='internal/store/tmpfile\.go$:G304,G302;internal/store/store\.go$:G304,G302;internal/store/safeopen_open_unix\.go$:G304;internal/store/probe\.go$:G304;internal/lock/lock\.go$:G304;internal/store/archive\.go$:G301;internal/cli/cmd_init\.go$:G301;internal/store/safeopen\.go$:G104' ./...

      # markdownlint-cli2 version is pinned: rule behaviour and the config
      # schema (globs/ignores/config) change between releases.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            bin: ticket
          - os: windows-latest
            bin: ticket.exe
          - os: macos-latest
            bin: ticket
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          VER=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
          VER=${VER:-dev}
          go build -ldflags "-X ticket/internal/cli.version=$VER" -o "${{ matrix.bin }}" ./cmd/ticket

      # coreutils checksum format (<hash>  <filename>, two spaces) so that
      # `sha256sum -c SHA256SUMS.txt` works on any OS. macOS runners ship no
      # GNU coreutils, hence shasum (perl) there; Windows embeds the trailing
      # LF in the string (`n) and keeps -NoNewline: pwsh would otherwise end
      # the line with \r\n, while the coreutils format requires \n at EOF.
      - name: Generate SHA256SUMS (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum ticket* > SHA256SUMS.txt

      - name: Generate SHA256SUMS (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: shasum -a 256 ticket* > SHA256SUMS.txt

      - name: Generate SHA256SUMS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash .\${{ matrix.bin }} -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.bin }}`n" } | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ticket-${{ matrix.os }}
          path: |
            ${{ matrix.bin }}
            SHA256SUMS.txt
          if-no-files-found: error
