# CI: lint + cross-platform build (linux / windows / macos).
# Version stamp comes from git describe; v* tag pushes act as release candidates.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor artipacked: the lint job needs no git credentials after
          # checkout; never persist the token into the local git config.
          persist-credentials: false

      # tickets/ is local-only by design (.gitignore:2): the ticket tree is a
      # per-machine source of truth and must never reach a clone. A force-added
      # ticket file ships one agent's local tree to every checkout (incident
      # T-0130), so the guard fails early, before spending time on the
      # toolchain. git ls-files is safe on a checkout without a tickets/
      # directory: it prints nothing, exit 0.
      - name: 'Guard: tickets/ must not be tracked'
        shell: bash
        run: |
          tracked=$(git ls-files -- 'tickets/')
          if [ -n "$tracked" ]; then
            echo "::error::Forbidden tracked files under tickets/:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no tracked files under tickets/"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go.mod owns the Go version; a floating 'stable' literal would drift.
          go-version-file: go.mod

      # gofmt -l exits 0 even when files need formatting, hence the test wrapper.
      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Linter versions are pinned: a new release may add findings and turn CI
      # red without any change in this repository, so the toolchain must stay
      # reproducible.
      - name: Install linters (pinned)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # gosec -exclude-rules format is path-regex:rules; the path key is a
      # regex that is NOT anchored at the start and only pins the '$' tail,
      # so a differently named sibling (store.go.bak) is still scanned,
      # while a nested copy carrying the identical path tail would match
      # as well. Every exclusion was triaged as a false positive / accepted
      # risk; the triage table lives in the plan page
      # d5a137cb-8f9a-45b7-a4d2-ab682c27d3fb.
      #
      # G304 — internal/store/safeopen_open_unix.go: the caller-supplied path
      #   is opened only after openValidated validated it (os.Lstat
      #   regular-file check, O_NOFOLLOW, os.SameFile identity re-check,
      #   T-0010).
      # G304 — internal/store/tmpfile.go:60, internal/store/store_lock.go:114,
      #   internal/store/probe.go:24, internal/lock/lock.go:71: write into the
      #   tickets directory the user selected (-C / $TICKETS_DIR / upward
      #   scan) with file names generated by the code; the CLI raises no
      #   privileges.
      # G304 — internal/cli/log.go: the log path is chosen by the user
      #   (TICKET_LOG); the file is opened append/create with mode 0600 and
      #   holds only operational paths/metadata, no ticket content or
      #   secrets (T-0110).
      # G304 — internal/releasecheck/cache.go: the cache path is derived from
      #   os.UserCacheDir (per-user), no secrets (T-0173).
      # G302/G301 — 0644 files and 0755 directories are the modes the tool
      #   itself uses for ticket files and the archive/ dir (store_lock.go:114,
      #   tmpfile.go:60, archive.go:182, cmd_init.go:46); ticket content is
      #   user markdown, not secrets.
      # G104 — unchecked f.Close() on the validation-failure path in
      #   internal/store/safeopen.go:64,68: the primary error is already
      #   returned and a close error cannot change the outcome.
      - name: Gosec
        run: |
          gosec -exclude-rules='internal/store/tmpfile\.go$:G304,G302;internal/store/store_lock\.go$:G304,G302;internal/store/safeopen_open_unix\.go$:G304;internal/store/probe\.go$:G304;internal/lock/lock\.go$:G304;internal/store/archive\.go$:G301;internal/cli/cmd_init\.go$:G301;internal/store/safeopen\.go$:G104;internal/cli/log\.go$:G304;internal/releasecheck/cache\.go$:G304' ./...

      # staticcheck runs without exclusions: the baseline is clean on the
      # pinned staticcheck version, so any finding reported here is a new
      # regression. Suppressing a finding here would hide regressions in
      # every other file, so file a NEW ticket instead of adding a
      # suppression. If the linter is bumped to another version, findings
      # may legitimately change — then update the version pin and re-check
      # the findings against the new version.
      - name: Staticcheck
        run: staticcheck ./...

      # markdownlint-cli2 version is pinned: rule behaviour and the config
      # schema (globs/ignores/config) change between releases.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # zizmor template-injection: matrix values are interpolated once into a
      # plain env var instead of directly into run-block expressions.
      BIN: ${{ matrix.bin }}
    strategy:
      # Matrix legs (per-OS build/test) must not cancel each other: with
      # fail-fast, one failing OS cancels the legs that have not reported
      # yet (T-0196).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            bin: ticket
          - os: windows-latest
            bin: ticket.exe
          - os: macos-latest
            bin: ticket
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # zizmor artipacked: version stamping reads tags, not credentials.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          VER=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
          VER=${VER:-dev}
          go build -ldflags "-X ticket/internal/cli.version=$VER" -o "$BIN" ./cmd/ticket

      # coreutils checksum format (<hash>  <filename>, two spaces) so that
      # `sha256sum -c SHA256SUMS.txt` works on any OS. macOS runners ship no
      # GNU coreutils, hence shasum (perl) there; Windows embeds the trailing
      # LF in the string (`n) and keeps -NoNewline: pwsh would otherwise end
      # the line with \r\n, while the coreutils format requires \n at EOF.
      - name: Generate SHA256SUMS (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum ticket* > SHA256SUMS.txt

      - name: Generate SHA256SUMS (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: shasum -a 256 ticket* > SHA256SUMS.txt

      - name: Generate SHA256SUMS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash .\$env:BIN -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $env:BIN`n" } | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ticket-${{ matrix.os }}
          path: |
            ${{ matrix.bin }}
            SHA256SUMS.txt
          if-no-files-found: error

  # Security audit (T-0207): static analysis of both workflows with zizmor,
  # pinned and integrity-checked. This job is deliberately isolated: it runs
  # no PR-code build steps, shares no caches or artifacts, has no secrets
  # (the automatic GITHUB_TOKEN is never exported into the environment and
  # is explicitly unset for every token-consuming invocation), and its
  # only network access is the pinned asset download below. New findings
  # break CI; the accepted-risks baseline lives in .github/zizmor.yml with
  # per-entry triage comments and the registry docs/security-accepted-risks.md.
  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      ZIZMOR_PERSONA: auditor
      ZIZMOR_CONFIG: .github/zizmor.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinning variant (b): the release asset of an exact version plus its
      # SHA-256 (equal to the GitHub API digest at pin time) plus an OFFLINE
      # Sigstore attestation check against vendored bundle/root files.
      # Upstream publishes no SHA256SUMS/signatures; the mutable ghcr image
      # was rejected because it carries no attestation. Never "latest",
      # never "curl | sh".
      - name: Download zizmor (pinned v1.32.0)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz

      # Integrity by digest, not by tag name: a re-uploaded asset under the
      # same tag fails this check.
      - name: Verify asset SHA-256
        run: |
          printf '%s  %s\n' \
            'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b' \
            zizmor.tar.gz | sha256sum -c -

      # Vendored attestation material must itself be intact before use.
      - name: Verify vendored attestation files
        run: |
          printf '%s  %s\n' \
            '5cf002bf186fe502ec7d0e1f134a625d0bebd13078019704d3be93bbb97b25ef' \
            .github/zizmor/bundle.json \
            '65ca537f6ed8a47fd0e560c421baa1f6c1efb8b25fc200d8c5c02c0e92eb2b9c' \
            .github/zizmor/trusted_root.jsonl | sha256sum -c -

      # Offline verification (SLSA provenance/v1 bundle): binds the asset
      # bytes to the release-binaries.yml build at refs/tags/v1.32.0 without
      # any API access, so no token is needed and none may leak.
      - name: Verify provenance (offline attestation)
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN gh attestation verify zizmor.tar.gz \
            --bundle .github/zizmor/bundle.json \
            --custom-trusted-root .github/zizmor/trusted_root.jsonl \
            --repo zizmorcore/zizmor \
            --signer-workflow zizmorcore/zizmor/.github/workflows/release-binaries.yml \
            --source-ref refs/tags/v1.32.0

      - name: Extract zizmor
        run: tar -xzf zizmor.tar.gz

      # Forced offline: no online lookups, credentials explicitly removed.
      # Any finding outside the documented baseline fails the job on
      # purpose; triage procedure: docs/ci-triage.md.
      - name: Audit workflows
        run: |
          if ! env -u GH_TOKEN -u GITHUB_TOKEN ./zizmor \
            --persona "$ZIZMOR_PERSONA" --offline \
            .github/workflows/ci.yml .github/workflows/ci-retry.yml \
            .github/workflows/ci-metrics.yml; then
            echo "::error::zizmor audit failed: new finding or audit error." \
              "Triage and baseline review: docs/ci-triage.md"
            exit 1
          fi
